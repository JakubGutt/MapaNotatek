name: Windows smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src\MapaNotatek\MapaNotatek.csproj

      - name: Build
        run: dotnet build src\MapaNotatek\MapaNotatek.csproj -c Debug -p:Platform=x64 -r win-x64 --no-restore

      - name: Run with 20s watchdog
        env:
          MAPANOTATEK_SMOKE: "1"
          CI: "true"
        run: |
          $exe = Get-ChildItem -Path src\MapaNotatek\bin -Recurse -Filter MapaNotatek.exe |
            Where-Object { $_.DirectoryName -match 'win-x64' } |
            Select-Object -First 1
          if (-not $exe) { throw "MapaNotatek.exe not found" }
          Write-Host "EXE $($exe.FullName)"
          $outDir = Join-Path $env:GITHUB_WORKSPACE "smoke-output"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $stdout = Join-Path $outDir "stdout.txt"
          $stderr = Join-Path $outDir "stderr.txt"
          $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName `
            -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $p.WaitForExit(20000)) {
            Write-Host "WATCHDOG: process still running after 20s, killing"
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1
          } else {
            Write-Host "exit $($p.ExitCode)"
          }
          Write-Host "---- stdout ----"
          if (Test-Path $stdout) { Get-Content $stdout }
          Write-Host "---- stderr ----"
          if (Test-Path $stderr) { Get-Content $stderr }
          $startup = Join-Path $env:TEMP "MapaNotatek-startup.log"
          $crash = Join-Path $env:TEMP "MapaNotatek-crash.log"
          if (Test-Path $startup) {
            Copy-Item $startup (Join-Path $outDir "MapaNotatek-startup.log")
            Write-Host "---- startup.log ----"
            Get-Content $startup
          }
          if (Test-Path $crash) {
            Copy-Item $crash (Join-Path $outDir "MapaNotatek-crash.log")
            Write-Host "---- crash.log ----"
            Get-Content $crash
            exit 1
          }
          $text = ""
          if (Test-Path $stdout) { $text = Get-Content $stdout -Raw }
          if ($text -notmatch "running event loop") {
            Write-Host "Did not reach event loop"
            exit 1
          }
          if ($text -notmatch "smoke: still alive") {
            Write-Host "Reached event loop but smoke timer did not fire"
            exit 1
          }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          if-no-files-found: ignore
          path: smoke-output/**
