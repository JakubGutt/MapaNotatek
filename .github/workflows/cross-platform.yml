name: Cross-platform smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore MapaNotatek.sln
      - name: Build
        run: dotnet build MapaNotatek.sln -c Release --no-restore -m:1
      - name: Storage, recovery and offline regression tests
        run: dotnet run --project tests/MapaNotatek.StorageTests/MapaNotatek.StorageTests.csproj -c Release --no-build
      - name: DOCX, PDF and offline HTML export tests
        run: dotnet run --project tests/MapaNotatek.ExportTests/MapaNotatek.ExportTests.csproj -c Release --no-build
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          chmod +x ./publish-macos.sh
          ./publish-macos.sh ${{ matrix.rid }}
      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./publish-windows.ps1 ${{ matrix.rid }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MapaNotatek-${{ matrix.rid }}
          path: |
            artifacts/MapaNotatek-${{ matrix.rid }}.zip
            artifacts/MapaNotatek-${{ matrix.rid }}.zip.sha256
