name: Cross-platform smoke

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore MapaNotatek.sln
      - name: Build
        run: dotnet build MapaNotatek.sln -c Release --no-restore -m:1
      - name: Storage, recovery and offline regression tests
        run: dotnet run --project tests/MapaNotatek.StorageTests/MapaNotatek.StorageTests.csproj -c Release --no-build
      - name: DOCX, PDF and offline HTML export tests
        run: dotnet run --project tests/MapaNotatek.ExportTests/MapaNotatek.ExportTests.csproj -c Release --no-build
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          chmod +x ./publish-macos.sh
          ./publish-macos.sh ${{ matrix.rid }}
      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -and
              -not (Test-Path "$env:ProgramFiles\Inno Setup 7\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          ./publish-windows.ps1 ${{ matrix.rid }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MapaNotatek-${{ matrix.rid }}
          path: |
            artifacts/MapaNotatek-${{ matrix.rid }}.zip
            artifacts/MapaNotatek-${{ matrix.rid }}.zip.sha256
            artifacts/MapaNotatek-Setup-${{ matrix.rid }}.exe
            artifacts/MapaNotatek-Setup-${{ matrix.rid }}.exe.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GH_REPO" --verify-tag --generate-notes --title "MapaNotatek $GITHUB_REF_NAME"
